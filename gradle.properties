# Pickaxe — metadonnees du build.
#
# Nom de travail : le nom public du plugin et son prix sont decides par le
# proprietaire (la "mere" du slot 5). L'identifiant (`id`) est DEFINITIF
# une fois le plugin publie sur le Marketplace : il ne doit plus changer.
#
# Voir /work/pickaxe/README.md pour la recette complete.

pluginGroupId = com.tgglabs.pickaxe
pluginName = Find in Commit History
pluginVersion = 0.0.1

# Compatibilite : `since-build` = 262 = IntelliJ Platform 2026.2.
# MESURE du 05/11/2026 : `product-info.json` de PyCharm 2026.2.4 dit
#   "version": "2026.2.4", "buildNumber": "262.11879.98"
# -> 262 est le numero de build EXACT de l'IDE de reference, pas une
# approximation. C'est aussi le build que le plugin est compile contre.
pluginSinceBuild = 262

# `until-build` : ABSENT, VOLONTAIREMENT.
# Le champ `pluginUntilBuild` a ete SUPPRIME de ce fichier le 05/11/2026 sur
# instruction de la Direction. Consequence measurable : le `plugin.xml`
# genere par `patchPluginXml` ne contient plus AUCUN attribut `until-build`
# (verifie dans le ZIP livre : `unzip -p <zip> '*/META-INF/plugin.xml'`).
# Raison : le plugin ne depend que de `com.intellij.modules.platform` et de
# l'API publique, qui n'a pas bouge depuis 2024.3. Une borne haute
# (`263.*`) interdirait l'installation sur la 2026.3 sans raison mesurable.

# IDE de compilation : 2026.2.4 == le `since-build` 262. Hors ligne, on compile
# CONTRE l'IDE deja installe dans le conteneur, en passant :
#   -PplatformLocalPath=/work/ide/pycharm-2026.2.4
# -> ZERO telechargement. Sans cette propriete, le build telecharge l'IDE
# `platformVersion` depuis le CDN JetBrains (mode reseau normal).
platformVersion = 2026.2.4
platformType = PY

pluginVendorName = Tgg Labs
pluginVendorEmail = tgg.apps.support@gmail.com
pluginVendorUrl = https://plugins.jetbrains.com/vendor/tgg-labs

# Le conteneur est limite a 1 572 864 000 octets de RAM (mesure : cgroup
# memory.max). 900 Mo pour le daemon Gradle laisse de la place au test JVM.
org.gradle.jvmargs = -Xmx900m -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
