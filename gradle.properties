# Build metadata.
#
# The public name of the plugin and its price are decided by the repository
# owner. The identifier (`id`) becomes DEFINITIVE once the plugin is published
# on the Marketplace: it must not change afterwards.

pluginGroupId = com.tgglabs.pickaxe
pluginName = Find in Commit History
pluginVersion = 0.0.1

# Compatibility: `since-build` = 243 = IntelliJ Platform 2024.3.
# The product-info.json of PyCharm Community 2024.3 says
#   "version": "2024.3", "buildNumber": "243.21565.199"
# -> 243 is the EXACT build number of the reference IDE, not an approximation.
# The official JetBrains Plugin Verifier gives, on that IDE, the verdict
# "Compatible. 1 usage of deprecated API" (0 compatibility problem), and the
# plugin is really LOADED by the 2024.3 IDE (see the proofs of the 06/11).
# The COMPILATION IDE is still 2026.2.4 (build 262.11879.98): the IDE you
# compile against and the IDE you are compatible with are two different things.
pluginSinceBuild = 243

# `until-build`: absent on purpose. The plugin only depends on
# `com.intellij.modules.platform`, whose public API has not changed since
# 2024.3: an upper bound would be a restriction without a measurable reason.

# Compilation IDE: 2026.2.4 (build 262.11879.98) — NOT the `since-build` 243.
# Offline, the plugin is compiled AGAINST the IDE already installed on the
# machine, by passing:
#   -PplatformLocalPath=/path/to/ide
# -> ZERO download. Without that property, the build downloads the IDE
# `platformVersion` from the JetBrains CDN.
platformVersion = 2026.2.4
platformType = PY

pluginVendorName = Tgg Labs
pluginVendorEmail = tgg.apps.support@gmail.com
pluginVendorUrl = https://plugins.jetbrains.com/vendor/tgg-labs

# The Gradle daemon is given 900 MB, leaving room for the test JVM.
org.gradle.jvmargs = -Xmx900m -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
